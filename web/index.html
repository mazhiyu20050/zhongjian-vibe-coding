<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>众见</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main aria-label="众见观点查询">

</form>
<div id="thinking" role="status" aria-label="正在思考" hidden><span></span><span></span><span></span></div>
</main></body></html>
