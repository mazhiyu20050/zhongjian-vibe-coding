<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>众见</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/people.css"><link rel="stylesheet" href="/shell.css"><script src="/app.js" defer></script><script src="/shell.js" defer></script><script src="/people.js" defer></script><link rel="stylesheet" href="/agents.css"><script src="/agents.js" defer></script></head>
<body><button id="menu-open" type="button" aria-label="打开侧栏" aria-controls="app-menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M6 12h12M6 17h12"/></svg></button><button id="new-chat" type="button" aria-label="新建对话" title="新建对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog id="app-menu" aria-label="众见侧栏"><div class="menu-head"><strong>众见</strong><button id="menu-close" type="button" aria-label="关闭侧栏">×</button></div><nav id="menu-actions" aria-label="偏好与设置"><button id="desktop-settings" type="button" disabled title="设置由本机桌面服务提供">设置</button></nav><h2 class="history-heading">历史对话</h2><div id="history-list"></div></dialog>
<main aria-label="众见观点查询">
<section id="results" aria-live="polite" aria-label="相关原文" hidden></section>
<form id="query-form" autocomplete="off">
<textarea id="question" name="question" rows="1" wrap="soft" maxlength="2000" placeholder="说说你的困惑" aria-label="输入你的困惑"></textarea>
<button id="submit" type="submit" aria-label="发送" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>
<div id="thinking" role="status" aria-label="正在思考" hidden><span></span><span></span><span></span></div>
</main></body></html>
